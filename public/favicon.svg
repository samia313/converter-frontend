<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#0ea5e9" rx="40"/>
  
  <!-- Document/PDF Icon -->
  <g transform="translate(48, 36)">
    <!-- Document shape -->
    <path d="M 12 0 L 84 0 L 96 12 L 96 108 Q 96 120 84 120 L 12 120 Q 0 120 0 108 L 0 12 Q 0 0 12 0" 
          fill="white" stroke="none"/>
    
    <!-- Page fold corner -->
    <path d="M 84 0 L 96 12 L 84 12 Z" fill="#e0f2fe" stroke="none"/>
    
    <!-- Text lines (representing PDF content) -->
    <rect x="8" y="20" width="80" height="3" fill="#0ea5e9" rx="1.5"/>
    <rect x="8" y="30" width="80" height="3" fill="#0ea5e9" rx="1.5"/>
    <rect x="8" y="40" width="80" height="3" fill="#0ea5e9" rx="1.5"/>
    <rect x="8" y="50" width="60" height="3" fill="#0ea5e9" rx="1.5"/>
    
    <!-- Bottom accent bar -->
    <rect x="0" y="100" width="96" height="20" fill="#0ea5e9" rx="0"/>
    <text x="48" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          fill="white" text-anchor="middle">PDF</text>
  </g>
</svg>
