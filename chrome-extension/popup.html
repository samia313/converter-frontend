<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFilio - PDF Tools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: #1f2937;
      font-weight: 500;
      font-size: 12px;
    }

    .tool-btn:hover {
      border-color: #dc2626;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
      transform: translateY(-2px);
    }

    .tool-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quick-actions {
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
      margin-top: 20px;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #f3f4f6;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e5e7eb;
    }

    .action-btn.primary {
      background: #dc2626;
      color: white;
    }

    .action-btn.primary:hover {
      background: #991b1b;
    }

    .footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
    }

    .footer a {
      color: #dc2626;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PDFilio</h1>
    <p>Quick PDF Tools</p>
  </div>

  <div class="content">
    <div class="section-title">Convert</div>
    <div class="tool-grid">
      <button class="tool-btn" id="convert-pdf-to-word">
        <div class="tool-icon">📄</div>
        <div>PDF to Word</div>
      </button>
      <button class="tool-btn" id="convert-word-to-pdf">
        <div class="tool-icon">📝</div>
        <div>Word to PDF</div>
      </button>
      <button class="tool-btn" id="convert-image-to-pdf">
        <div class="tool-icon">🖼️</div>
        <div>Image to PDF</div>
      </button>
      <button class="tool-btn" id="convert-html-to-pdf">
        <div class="tool-icon">🌐</div>
        <div>HTML to PDF</div>
      </button>
    </div>

    <div class="section-title">Organize</div>
    <div class="tool-grid">
      <button class="tool-btn" id="merge-pdfs">
        <div class="tool-icon">🔗</div>
        <div>Merge PDF</div>
      </button>
      <button class="tool-btn" id="split-pdfs">
        <div class="tool-icon">✂️</div>
        <div>Split PDF</div>
      </button>
      <button class="tool-btn" id="compress-pdf">
        <div class="tool-icon">📦</div>
        <div>Compress PDF</div>
      </button>
      <button class="tool-btn" id="rotate-pdf">
        <div class="tool-icon">🔄</div>
        <div>Rotate PDF</div>
      </button>
    </div>

    <div class="quick-actions">
      <div class="section-title">Quick Actions</div>
      <button class="action-btn primary" id="open-pdfilio">
        Open PDFilio.com
      </button>
      <button class="action-btn" id="upload-file">
        Upload File from Computer
      </button>
      <button class="action-btn" id="settings">
        Settings
      </button>
    </div>

    <div class="footer">
      <p>Made with ❤️ by PDFilio</p>
      <p><a href="https://pdfilio.com/about" target="_blank">About</a> • 
         <a href="https://pdfilio.com/security" target="_blank">Security</a> • 
         <a href="https://pdfilio.com/contact" target="_blank">Contact</a></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
