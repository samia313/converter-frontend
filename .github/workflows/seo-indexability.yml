name: Production SEO Indexability Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  indexability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sitemap source audit
        run: node scripts/seo-sitemap-source-audit.mjs
      - name: Run production indexability audit
        run: node scripts/seo-production-indexability-audit.mjs
