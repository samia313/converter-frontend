name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      - run: pnpm run build

  conversion-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python PDF to Word engine
        working-directory: digitalocean-server
        run: python3 -m pip install -r engines/requirements.txt

      - name: Install conversion server dependencies
        working-directory: digitalocean-server
        run: npm install
      - name: Python engine syntax check
        working-directory: digitalocean-server
        run: python3 -m py_compile engines/pdf_to_docx.py

      - name: Syntax check
        working-directory: digitalocean-server
        run: npm run check
      - name: PDF to Word engine smoke test
        working-directory: digitalocean-server
        run: npm run test:pdf-to-word
